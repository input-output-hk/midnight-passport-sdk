packages:
  - packages/*
  - apps/*

# Supply-chain posture, natively enforced (docs/development-workflow.md §4;
# flagged by org code scanning on the migration PR).
# SDK release gate: dependencies must have been available for seven days.
minimumReleaseAge: 10080
# No transitive dependencies from git/URL sources — registry only.
blockExoticSubdeps: true
# Updates may never weaken these settings.
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.4
  - pnpm@10.34.4
