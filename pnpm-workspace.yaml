packages:
  - packages/*
  - apps/*

# Supply-chain posture, natively enforced (docs/development-workflow.md §4;
# flagged by org code scanning on the migration PR).
# SDK release gate: dependencies must have been available for seven days.
minimumReleaseAge: 10080
# No transitive dependencies from git/URL sources — registry only.
blockExoticSubdeps: true
# Updates may never weaken these settings.
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Owner-approved #315 compatibility qualification. Keep all other version checks.
  - '@midnames/sdk@2.1.0'
  - '@midnight-ntwrk/midnight-js-types@5.0.0'
  - '@midnight-ntwrk/midnight-js-contracts@5.0.0'
  - '@midnight-ntwrk/midnight-js-indexer-public-data-provider@5.0.0'
  - '@midnight-ntwrk/wallet-sdk-address-format@4.0.0'
  - '@midnight-ntwrk/midnight-js-protocol@5.0.0'
  - '@midnight-ntwrk/midnight-js-utils@5.0.0'
  - '@midnightntwrk/ledger-v9@1.0.0 || 1.0.1'
  - '@midnight-ntwrk/compact-js@3.0.0'
  - '@midnightntwrk/wallet-sdk-address-format@4.0.0'
  - '@midnightntwrk/onchain-runtime-v4@4.0.0'
