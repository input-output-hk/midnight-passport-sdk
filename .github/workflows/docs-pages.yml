name: SDK documentation

on:
  push:
    branches: [passport-acc-prototype]
    paths:
      - 'docs-site/**'
      - 'docs/site/**'
      - 'docs/examples/**'
      - 'scripts/docs/check-rendered.py'
      - 'tests/docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'input-output-hk/midnight-passport-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install isolated documentation tools
        run: npm ci --prefix docs-site
      - name: Build VitePress under the Pages base path
        env:
          DOCS_BASE: /midnight-passport-sdk/
        run: npm run build --prefix docs-site
      - name: Check rendered local links and anchors
        run: |
          python3 -m unittest discover -s tests/docs -p 'test_*.py'
          python3 scripts/docs/check-rendered.py docs-site/.vitepress/dist --base-url /midnight-passport-sdk
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.repository == 'input-output-hk/midnight-passport-sdk'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
