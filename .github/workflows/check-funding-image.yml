name: Check Passport funding image

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'apps/passport-funding-service/**'
      - 'packages/contract/**'
      - 'packages/protocol/**'
      - 'packages/service/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/check-funding-image.yml'
      - '.github/workflows/publish-funding-image.yml'
      - 'scripts/smoke-funding-image.sh'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Linux image
        run: docker build -f apps/passport-funding-service/Dockerfile -t midnight-passport-funding:check .
      - name: Check image startup refusal
        run: bash scripts/smoke-funding-image.sh midnight-passport-funding:check
