# Enforcement layer — deterministic guarantees per docs/development-workflow.md §4.
# Skills judge; this gate guarantees. Actions are pinned by commit SHA (the
# exact-pin dependency discipline, applied to the workflow itself).
name: PR checks

# Required release checks run for every pull request.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Discard obsolete PR runs, but keep independent manual runs separate.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  diff-size:
    name: Review size (5k–10k preferred)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report authored review size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash mn-passport-skills/scripts/check-diff-size.sh "origin/$BASE_REF" --ci

  dep-cooldown:
    name: 7-day dependency cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Reject package versions younger than 7 days
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node mn-passport-skills/scripts/check-dep-cooldown.mjs "origin/$BASE_REF"

  gitignore-backstop:
    name: Registers never tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if a register path is tracked or no longer git-ignored
        run: |
          if git ls-files | grep -iE '(^|/)\.mn-passport-skills(/|$)|security-register|verify-register'; then
            echo "::error::A register path is tracked — registers must never land in this repo (docs/development-workflow.md §4)."
            exit 1
          fi
          if ! git check-ignore -q .mn-passport-skills/probe; then
            echo "::error::.mn-passport-skills/ is no longer git-ignored — restore the exclusion (docs/development-workflow.md §4)."
            exit 1
          fi
          echo "Registers stay out of this repo."

  build-lint-test:
    name: Lint, format, build, and test
    runs-on: ubuntu-latest
    # The warm-job target is 30–45 s, not a timeout that conceals real failures.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Prepare pnpm
        run: |
          corepack enable
          pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm"
      - name: Restore dependency downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/pnpm
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-workspace.yaml', '.npmrc', 'pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint and format
        run: |
          pnpm run lint
          pnpm run format:check
      - name: Build and check script types
        run: pnpm run build
      - name: Test packages and applications
        run: |
          pnpm test
          pnpm run test:apps
          node --test apps/passport-key-service/test/*.test.mjs
      - name: Check application types
        run: |
          pnpm --filter passport-service exec tsc --noEmit -p .
          pnpm --filter passport-funding-service exec tsc --noEmit -p .
          pnpm --filter passport-dapp exec tsc --noEmit -p .
