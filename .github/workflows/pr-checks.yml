# Enforcement layer — deterministic guarantees per docs/development-workflow.md §4.
# Skills judge; this gate guarantees. Actions are pinned by commit SHA (the
# exact-pin dependency discipline, applied to the workflow itself).
name: PR checks

# Required release checks run for every pull request.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Discard obsolete PR runs, but keep independent manual runs separate.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  diff-size:
    name: Review size (5k–10k preferred)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report authored review size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash mn-passport-skills/scripts/check-diff-size.sh "origin/$BASE_REF" --ci

  dep-cooldown:
    name: 7-day dependency cooldown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Reject package versions younger than 7 days
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node mn-passport-skills/scripts/check-dep-cooldown.mjs "origin/$BASE_REF"

  gitignore-backstop:
    name: Registers never tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if a register path is tracked or no longer git-ignored
        run: |
          if git ls-files | grep -iE '(^|/)\.mn-passport-skills(/|$)|security-register|verify-register'; then
            echo "::error::A register path is tracked — registers must never land in this repo (docs/development-workflow.md §4)."
            exit 1
          fi
          if ! git check-ignore -q .mn-passport-skills/probe; then
            echo "::error::.mn-passport-skills/ is no longer git-ignored — restore the exclusion (docs/development-workflow.md §4)."
            exit 1
          fi
          echo "Registers stay out of this repo."

  lint_checks:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-workspace
      - name: Lint and format
        run: |
          pnpm run lint
          pnpm run format:check

  build_types:
    name: Fresh build and all types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-workspace
      - name: Build and check every script type
        run: pnpm run build
      - name: Check application types
        run: |
          pnpm --filter passport-service exec tsc --noEmit -p .
          pnpm --filter passport-funding-service exec tsc --noEmit -p .
          pnpm --filter passport-dapp exec tsc --noEmit -p .

  app_tests:
    name: Application and key service tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-workspace
      - name: Fresh package outputs
        run: pnpm exec tsc -b tsconfig.build.json
      - name: Test all applications and key service
        run: |
          pnpm run test:apps
          node --test apps/passport-key-service/test/*.test.mjs

  demo_browser:
    name: Demo UI journeys (${{ matrix.arm }}, ${{ matrix.group }}, synthetic credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        arm: [p256, jubjub]
        group: [presentation, account-actions, scoped-sessions, owner-safety]
    env:
      CHROME_BIN: /usr/bin/google-chrome
      PASSPORT_DEMO_JOURNEY_ARM: ${{ matrix.arm }}
      PASSPORT_DEMO_JOURNEY_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-workspace
      - name: Fresh package outputs
        run: pnpm exec tsc -b tsconfig.build.json
      - name: Browser worker and IndexedDB contracts
        if: matrix.arm == 'p256' && matrix.group == 'presentation'
        env:
          PASSPORT_BACKGROUND_OUTPUT: ${{ runner.temp }}/background-quality.json
        run: pnpm test:background
      - name: Actual Chromium UI with isolated synthetic account and chain drivers
        env:
          PASSPORT_DEMO_JOURNEY_OUTPUT: ${{ runner.temp }}/demo-journeys.json
        run: pnpm test:demo-browser
      - name: Retain exact cell receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-${{ matrix.arm }}-${{ matrix.group }}
          path: ${{ runner.temp }}/demo-journeys.json
          archive: true
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
      - name: Retain declared browser scope in job summary
        if: always()
        env:
          PASSPORT_DEMO_JOURNEY_OUTPUT: ${{ runner.temp }}/demo-journeys.json
        run: |
          if test -f "$PASSPORT_DEMO_JOURNEY_OUTPUT"; then
            cat "$PASSPORT_DEMO_JOURNEY_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/background-quality.json"; then
            cat "$RUNNER_TEMP/background-quality.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  demo_browser_aggregate:
    name: Complete browser journey inventory
    if: always()
    needs: [demo_browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journey-*
          path: ${{ runner.temp }}/journey-artifacts
          merge-multiple: false
          digest-mismatch: error
      - name: Require eight matching, disjoint and exhaustive cells
        env:
          BROWSER_RESULT: ${{ needs.demo_browser.result }}
        run: |
          test "$BROWSER_RESULT" = success
          node scripts/qualification/demo-journey-receipts.mjs --input "$RUNNER_TEMP/journey-artifacts" --source "$GITHUB_SHA" > "$RUNNER_TEMP/journey-aggregate.json"
          cat "$RUNNER_TEMP/journey-aggregate.json" >> "$GITHUB_STEP_SUMMARY"

  package_tests:
    name: Package tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-workspace
      - name: Fresh package outputs (script types run in build_types)
        run: pnpm exec tsc -b tsconfig.build.json
      - name: Run every package test through Node's disjoint file shards
        run: |
          node -e "if(require('node:fs').globSync('tests/**/*.test.mjs').length < 4){console.error('expected at least four test files for four nonempty shards');process.exit(1)}"
          node --test --test-shard=${{ matrix.shard }}/4 "tests/**/*.test.mjs"

  # Preserve the required check name. A failed, cancelled or skipped dependency fails it.
  build-lint-test:
    name: Lint, format, build, and test
    if: always()
    needs: [lint_checks, build_types, app_tests, package_tests, demo_browser, demo_browser_aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every full gate component
        env:
          LINT_RESULT: ${{ needs.lint_checks.result }}
          TYPES_RESULT: ${{ needs.build_types.result }}
          APPS_RESULT: ${{ needs.app_tests.result }}
          PACKAGES_RESULT: ${{ needs.package_tests.result }}
          BROWSER_RESULT: ${{ needs.demo_browser.result }}
          BROWSER_INVENTORY_RESULT: ${{ needs.demo_browser_aggregate.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TYPES_RESULT" = success
          test "$APPS_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BROWSER_INVENTORY_RESULT" = success
