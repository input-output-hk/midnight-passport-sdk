name: Check Passport key image

on:
  pull_request:
    paths:
      - 'apps/passport-key-service/**'
      - 'packages/contract/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/check-key-image.yml'
      - '.github/workflows/publish-key-image.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test the Node key server
        run: nix develop -c node --test apps/passport-key-service/test/*.test.mjs
      - name: Build the pinned Linux image
        run: nix build .#passport-key-service-image --out-link result-key-image
      - name: Smoke-test the image
        run: |
          docker load -i result-key-image
          docker run --rm --entrypoint /bin/node midnight-passport-keys:build --version
          test "$(docker image inspect midnight-passport-keys:build --format '{{.Config.User}}')" = '10001:10001'
