name: Check SDK release

on:
  push:
    tags: ['sdk-check-v*', 'sdk-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact shared semver version, for example 0.1.0-dev.1
        required: true
        type: string
      dist_tag:
        description: GitHub Packages distribution tag
        required: true
        default: dev
        type: choice
        options: [dev, next, latest]

permissions:
  contents: read

concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'input-output-hk/midnight-passport-sdk' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/passport-acc-prototype') || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/sdk-check-v') || startsWith(github.ref, 'refs/tags/sdk-v'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin passport-acc-prototype
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
              echo 'Release tag must point to passport-acc-prototype history.' >&2
              exit 1
            }
            if [[ "$GITHUB_REF_NAME" == sdk-check-v* ]]; then
              version="${GITHUB_REF_NAME#sdk-check-v}"
            else
              version="${GITHUB_REF_NAME#sdk-v}"
            fi
            if [[ "$version" == *-dev* ]]; then
              tag=dev
            elif [[ "$version" == *-* ]]; then
              tag=next
            else
              tag=latest
            fi
          else
            version="$INPUT_VERSION"
            tag="$INPUT_DIST_TAG"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Verify signed release tag and DCO commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq ".verification.verified and .object.sha == \"$GITHUB_SHA\"" | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.verification.verified and (.commit.message | test("(?m)^Signed-off-by: .+ <[^>]+>$"))' | grep -qx true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install and verify
        run: |
          nix develop -c pnpm install --frozen-lockfile
          nix develop -c pnpm run lint
          nix develop -c pnpm run format:check
          nix develop -c pnpm run build
          nix develop -c pnpm test
          nix develop -c pnpm run test:apps
          nix develop -c pnpm --filter passport-service exec tsc --noEmit -p .
          nix develop -c pnpm --filter passport-funding-service exec tsc --noEmit -p .
          nix develop -c pnpm --filter passport-dapp exec tsc --noEmit -p .
      - name: Pack and inspect publishable tarballs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: nix develop -c node scripts/release-packages.mjs pack
      - name: Install and exercise packed packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: nix develop -c node scripts/smoke-release-tarballs.mjs
      - name: Check packed packages against the pinned Lace Passport source
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          lace_checkout="$RUNNER_TEMP/lace-passport-consumer"
          mkdir -p "$lace_checkout"
          git -C "$lace_checkout" init
          git -C "$lace_checkout" remote add origin https://github.com/input-output-hk/lace-platform.git
          git -C "$lace_checkout" sparse-checkout set packages/contract/passport/src
          git -C "$lace_checkout" fetch --depth=1 --filter=blob:none origin pull/2845/head
          git -C "$lace_checkout" checkout --detach FETCH_HEAD
          LACE_CHECKOUT="$lace_checkout" nix develop -c node scripts/smoke-lace-source-consumer.mjs
      - name: Attest tarballs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-tarballs/*.tgz
