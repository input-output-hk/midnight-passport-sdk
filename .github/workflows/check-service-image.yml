name: Check Passport service image

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'apps/passport-service/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/check-service-image.yml'
      - '.github/workflows/publish-service-image.yml'
      - 'scripts/smoke-service-image.sh'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: check-service-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build Linux image with cached layers
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/passport-service/Dockerfile
          tags: midnight-passport-service:check
          load: true
          push: false
          cache-from: type=gha,scope=passport-service-check
          cache-to: type=gha,scope=passport-service-check,mode=min
      - name: Check image startup refusal
        run: bash scripts/smoke-service-image.sh midnight-passport-service:check
