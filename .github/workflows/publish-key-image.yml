name: Publish Passport key service image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 0.1.0-rc1
        required: true
        type: string
  push:
    tags: ['keys-v*']

permissions:
  contents: read

concurrency:
  group: passport-key-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'input-output-hk/midnight-passport-sdk' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/passport-acc-prototype') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/keys-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select and validate version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin passport-acc-prototype
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
              echo 'Key image tag must point to passport-acc-prototype history.' >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#keys-v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]] || {
            echo 'Version must be semver, for example 0.1.0-rc1.' >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify signed release tag and DCO commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq ".verification.verified and .object.sha == \"$GITHUB_SHA\"" | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.verification.verified and (.commit.message | test("(?m)^Signed-off-by: .+ <[^>]+>$"))' | grep -qx true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test the Node key server
        run: nix develop -c node --test apps/passport-key-service/test/*.test.mjs
      - name: Build the pinned Linux image
        run: nix build .#passport-key-service-image --out-link result-key-image
      - name: Smoke-test the image
        run: |
          docker load -i result-key-image
          docker run --rm --entrypoint /bin/node midnight-passport-keys:build --version
          test "$(docker image inspect midnight-passport-keys:build --format '{{.Config.User}}')" = '10001:10001'
      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/input-output-hk/midnight-passport-keys"
          docker tag midnight-passport-keys:build "$image:$IMAGE_VERSION"
          docker tag midnight-passport-keys:build "$image:sha-${GITHUB_SHA:0:12}"
          docker push "$image:$IMAGE_VERSION"
          docker push "$image:sha-${GITHUB_SHA:0:12}"
          echo "Published $image:$IMAGE_VERSION and $image:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
