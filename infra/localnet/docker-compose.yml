# Midnight localnet — node + indexer + proof server, on ledger 9.
#
#   cp infra/localnet/.env.example infra/localnet/.env   # fill APP__INFRA__SECRET
#   docker compose -f infra/localnet/docker-compose.yml up -d
#   # macOS: add -f infra/localnet/docker-compose.macos.yml
#
# Image tags follow the reference ACC's localnet in the planning workspace
# (contract/infra/docker-compose.yml there, as verified on Compact 0.35.0 on
# 2026/10/01), so contract tests and the SDK run against the same chain.
# Override a tag with MIDNIGHT_NODE_TAG, MIDNIGHT_INDEXER_TAG, or
# MIDNIGHT_PROOF_TAG.
#
# - proof-server 9.0.0-rc.8 reads ZKIR 3.1 (Compact 0.35.0, --feature-zkir-v3).
# - The indexer is a commit-pinned rc.6 candidate, published on GHCR only:
#   the numbered rc.5 exits at genesis on node 2.1.0-rc.x.
# - Its storage layout changed at rc.5, and ledger lines do not migrate:
#   use fresh volumes (`docker compose … down -v`) when changing images.

name: mn-passport-sdk-localnet

services:
  node:
    image: 'midnightntwrk/midnight-node:${MIDNIGHT_NODE_TAG:-2.1.0-rc.4}'
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - node-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

  indexer:
    image: 'ghcr.io/midnightntwrk/indexer-standalone:${MIDNIGHT_INDEXER_TAG:-4.4.0-rc.6-b5e6c809}'
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - indexer-data:/data
    env_file:
      - .env
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,info'
      APP__INFRA__NODE__URL: 'ws://localhost:9944' # nosemgrep
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      # Required non-empty since indexer 4.3.x; SPO features are unused on a
      # localnet, so any placeholder is accepted.
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'dummy-not-using-spo'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: 'midnightntwrk/proof-server:${MIDNIGHT_PROOF_TAG:-9.0.0-rc.8}'
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    environment:
      RUST_BACKTRACE: 'full'
      EXTRA_ARGS: -v

volumes:
  node-data:
  indexer-data:
