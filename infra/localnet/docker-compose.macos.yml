# macOS override — Docker Desktop has no host networking for these images,
# so use a bridge network with the localnet ports published on the host ports
# from ports.env (19944/18088/16300 by default), beside any other localnet.
#
#   docker compose --env-file infra/localnet/ports.env -f infra/localnet/docker-compose.yml \
#     -f infra/localnet/docker-compose.macos.yml up -d

services:
  node:
    network_mode: ''
    networks: [midnight]
    ports:
      - '127.0.0.1:${MN_NODE_PORT:-19944}:9944'

  indexer:
    network_mode: ''
    networks: [midnight]
    ports:
      - '127.0.0.1:${MN_INDEXER_PORT:-18088}:8088'
    environment:
      # Plaintext ws is intentional: container to container on the private
      # compose bridge network; the localnet node terminates no TLS.
      APP__INFRA__NODE__URL: 'ws://node:9944' # nosemgrep
      # Indexer 4.3+ opens a second (SPO) node connection with its own URL;
      # without it the indexer dials localhost inside the bridge network and
      # exits once its reconnect budget runs out.
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944' # nosemgrep

  proof-server:
    network_mode: ''
    networks: [midnight]
    ports:
      - '127.0.0.1:${MN_PROOF_PORT:-16300}:6300'

networks:
  midnight:
    driver: bridge
